name: Publish tested containers
on:
  workflow_dispatch:
    inputs:
      component:
        description: Container component to rebuild
        type: choice
        options: [all, web, worker]
        default: all
      catchup_release:
        description: Optional release tag containing validated public report bundles
        type: string
        default: ''
      reuse_worker_runtime:
        description: Reuse the verified pinned worker runtime only when analytics and runtime recipe are unchanged
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
  web:
    needs: verify
    if: inputs.component != 'worker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact requested revision
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Build web
        run: docker build -f Dockerfile.web -t ghcr.io/${{ github.repository_owner }}/under-review-web:${{ github.sha }} .
      - name: Publish web
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/under-review-web:${{ github.sha }}
  worker:
    needs: verify
    if: inputs.component != 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the exact requested revision
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Restore pinned analytics dependencies
        if: ${{ !inputs.reuse_worker_runtime }}
        run: docker build -f analytics/Dockerfile -t under-review-analytics:local .
      - name: Test analytics
        if: ${{ !inputs.reuse_worker_runtime }}
        run: docker run --rm under-review-analytics:local Rscript analytics/tests/run.R
      - name: Build worker
        if: ${{ !inputs.reuse_worker_runtime }}
        run: docker build -f Dockerfile.worker -t ghcr.io/${{ github.repository_owner }}/under-review-worker:${{ github.sha }} .
      - name: Verify and reuse the recorded analytics runtime
        if: ${{ inputs.reuse_worker_runtime }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const {worker}=JSON.parse(readFileSync('deploy/images.json','utf8'));
          assert.equal(worker.anonymousManifestVerified,true);
          assert.match(worker.sourceCommit,/^[a-f0-9]{40}$/);
          assert.match(worker.image,/^ghcr\.io\/yaboijbigs\/under-review-worker@sha256:[a-f0-9]{64}$/);
          appendFileSync(process.env.GITHUB_ENV,`WORKER_BASE=${worker.image}\nWORKER_BASE_COMMIT=${worker.sourceCommit}\n`);
          NODE
      - name: Check runtime compatibility and build application update
        if: ${{ inputs.reuse_worker_runtime }}
        run: |
          git fetch --depth 1 origin "$WORKER_BASE_COMMIT"
          git diff --exit-code "$WORKER_BASE_COMMIT" "$GITHUB_SHA" -- analytics Dockerfile.worker
          docker pull "$WORKER_BASE"
          docker run --rm "$WORKER_BASE" Rscript analytics/tests/run.R
          docker build -f Dockerfile.worker-app --build-arg WORKER_BASE="$WORKER_BASE" -t ghcr.io/${{ github.repository_owner }}/under-review-worker:${{ github.sha }} .
      - name: Publish worker
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/under-review-worker:${{ github.sha }}
  catchup:
    needs: worker
    if: inputs.catchup_release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact requested revision
        run: |
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --depth 1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Download and verify public source bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CATCHUP_RELEASE: ${{ inputs.catchup_release }}
        run: |
          gh release download "$CATCHUP_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern under-review-catchup.tar.gz --pattern under-review-catchup.sha256
          sha256sum --check under-review-catchup.sha256
          python3 -c "import tarfile; tarfile.open('under-review-catchup.tar.gz').extractall('catchup-bundles', filter='data')"
      - name: Build catch-up image with the tested worker
        run: docker build -f Dockerfile.catchup --build-arg WORKER_IMAGE=ghcr.io/${{ github.repository_owner }}/under-review-worker:${{ github.sha }} -t ghcr.io/${{ github.repository_owner }}/under-review-catchup:${{ github.sha }} .
      - name: Publish catch-up image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/${{ github.repository_owner }}/under-review-catchup:${{ github.sha }}
