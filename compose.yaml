name: under-review
x-app-env: &app-env
  PROJECT_ROOT: /app
  DATABASE_URL: postgresql://${POSTGRES_USER:-under_review}:${POSTGRES_PASSWORD:?Run npm run local:init first}@db:5432/${POSTGRES_DB:-under_review}
  DATA_DIR: /data
  SITE_URL: ${SITE_URL:-http://localhost:4380}
  PRIVATE_STAGING: ${PRIVATE_STAGING:-true}
  TARGET_SEASON: ${TARGET_SEASON:-2026}
  LIVE_POSTING_ALLOWED: ${LIVE_POSTING_ALLOWED:-false}
  SESSION_SECRET: ${SESSION_SECRET}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
  BRAND_NAME: ${BRAND_NAME:-Under Review}
  BRAND_TAGLINE: ${BRAND_TAGLINE:-What actually swung the game?}
  BRAND_ACCENT: ${BRAND_ACCENT:-}
  BRAND_BACKGROUND: ${BRAND_BACKGROUND:-}
  BRAND_INK: ${BRAND_INK:-}
  SOCIAL_HANDLE: ${SOCIAL_HANDLE:-}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-under_review}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run local:init first}
      POSTGRES_DB: ${POSTGRES_DB:-under_review}
    ports: ["127.0.0.1:5439:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    image: under-review-worker:local
    build: {context: ., dockerfile: Dockerfile.worker}
    environment: *app-env
    command: ["npm", "run", "ur", "--", "migrate"]
    depends_on: {db: {condition: service_healthy}}
    networks: [private]
    restart: "no"
  web:
    image: under-review-web:local
    build: {context: ., dockerfile: Dockerfile.web}
    environment: *app-env
    ports: ["127.0.0.1:4380:3000"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [private]
    restart: unless-stopped
  worker:
    image: under-review-worker:local
    build: {context: ., dockerfile: Dockerfile.worker}
    environment: *app-env
    command: [node, --import, tsx, apps/worker/src/index.ts]
    volumes: ["artifacts:/data"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    networks: [private]
    restart: unless-stopped
volumes:
  database:
  artifacts:
networks:
  private:
